name: CORS test (temporary)
on:
  push:
    branches: [claude/modest-shannon-uc9c8l]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check CORS headers on ganttdata
        run: |
          URL="https://app.thefoodcorridor.com/listings/7542-akron-food-works/tfc_calendars/ganttdata?date=$(date -d 'today 00:00' +%s)"
          echo "== GET with Origin =="
          curl -sS -D - -o body.json -H "Origin: https://akronfoodworks.github.io" "$URL" | grep -iE '^(HTTP|access-control|content-type|cache-control|set-cookie|vary)'
          echo "body bytes: $(wc -c < body.json)"; head -c 300 body.json; echo
          echo "== OPTIONS preflight =="
          curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://akronfoodworks.github.io" -H "Access-Control-Request-Method: GET" "$URL" | grep -iE '^(HTTP|access-control)'
